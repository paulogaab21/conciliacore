<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102d29" />
    <title>Sem conexão | ConciliaCore</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #102d29;
        color: #f3f6f5;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card { max-width: 340px; }
      svg { width: 72px; height: 72px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: #a9c4bc; line-height: 1.5; font-size: 14px; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 22px;
        background: #43e3ae;
        color: #062019;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#173733" />
        <path d="M13 16h10.5a7.5 7.5 0 0 1 0 15H20" fill="none" stroke="#43e3ae" stroke-width="4" stroke-linecap="round" />
        <path d="m16 26-5 5 5 5M31 12l5 5-5 5" fill="none" stroke="#43e3ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1 id="offline-title">Você está offline</h1>
      <p id="offline-description">O ConciliaCore precisa de conexão para carregar dados de conciliação em tempo real. Verifique sua rede e tente novamente.</p>
      <button id="retry-button" onclick="location.reload()">Tentar novamente</button>
    </div>
    <script>
      const copy = {
        "pt-BR": {
          pageTitle: "Sem conexão | ConciliaCore",
          title: "Você está offline",
          description: "O ConciliaCore precisa de conexão para carregar dados de conciliação em tempo real. Verifique sua rede e tente novamente.",
          retry: "Tentar novamente",
        },
        en: {
          pageTitle: "Offline | ConciliaCore",
          title: "You are offline",
          description: "ConciliaCore needs a connection to load real-time reconciliation data. Check your network and try again.",
          retry: "Try again",
        },
      };
      const savedLocale = document.cookie
        .split("; ")
        .find((entry) => entry.startsWith("conciliacore_locale="))
        ?.split("=")[1];
      const locale = savedLocale === "en" ? "en" : "pt-BR";
      const messages = copy[locale];

      document.documentElement.lang = locale;
      document.title = messages.pageTitle;
      document.querySelector("#offline-title").textContent = messages.title;
      document.querySelector("#offline-description").textContent = messages.description;
      document.querySelector("#retry-button").textContent = messages.retry;
    </script>
  </body>
</html>
