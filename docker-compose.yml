name: conciliacore

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: conciliacore
      POSTGRES_PASSWORD: conciliacore
      POSTGRES_DB: conciliacore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conciliacore -d conciliacore"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - conciliacore_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: worker
    command: ["sh", "-c", "npx prisma migrate deploy && npm run db:seed"]
    environment: &app-environment
      DATABASE_URL: postgresql://conciliacore:conciliacore@postgres:5432/conciliacore?schema=public
      AUTH_SECRET: local-compose-auth-secret-change-before-production
      ENCRYPTION_KEY: local-compose-encryption-key-change-before-prod
      DEMO_WEBHOOK_SECRET: demo-webhook-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WORKER_POLL_MS: 2000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  conciliacore_postgres:
